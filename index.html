<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Showcase</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Website tours, Digital Doorway Marketing videos and commercials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b24;
    --surface-2: #1e2531;
    --line: #2a3242;
    --text: #eef1f6;
    --muted: #9aa4b5;
    --accent: #e8b04b;
    --accent-ink: #1a1305;
    --radius: 14px;
    --max: 1200px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

  /* Header */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header.top .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
  .brand { font: 700 20px/1 Fraunces, Georgia, serif; text-decoration: none; white-space: nowrap; }
  .brand span { color: var(--accent); }
  nav.links { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  nav.links::-webkit-scrollbar { display: none; }
  nav.links a {
    padding: 8px 14px; border-radius: 999px; text-decoration: none;
    color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  nav.links a:hover { color: var(--text); background: var(--surface-2); }

  /* Hero */
  .hero { padding: 72px 0 40px; }
  .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .hero h1 {
    font: 700 clamp(36px, 6vw, 64px)/1.05 Fraunces, Georgia, serif;
    margin: 12px 0 16px; letter-spacing: -0.02em; max-width: 14ch;
  }
  .hero p { color: var(--muted); font-size: 18px; max-width: 56ch; margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 32px; }
  .stats div { font-size: 14px; color: var(--muted); }
  .stats strong { display: block; font: 700 28px/1.1 Fraunces, Georgia, serif; color: var(--text); }

  /* Partner links */
  .partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 8px 0 24px; }
  .partner {
    display: flex; flex-direction: column; gap: 6px;
    padding: 20px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
    text-decoration: none; transition: border-color .2s, transform .2s;
  }
  .partner:hover { border-color: var(--accent); transform: translateY(-2px); }
  .partner .tag { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .partner .name { font: 700 20px/1.2 Fraunces, Georgia, serif; }
  .partner .desc { color: var(--muted); font-size: 14px; }
  .partner .go { margin-top: auto; padding-top: 8px; font-size: 14px; font-weight: 600; }
  .partner .go::after { content: " →"; }

  /* Sections */
  section.cat { padding: 48px 0 16px; }
  .cat-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .cat-head h2 { font: 700 clamp(28px, 4vw, 38px)/1.1 Fraunces, Georgia, serif; margin: 6px 0 0; letter-spacing: -0.01em; }
  .cat-head p { color: var(--muted); margin: 8px 0 0; max-width: 60ch; }
  .count { color: var(--muted); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: #3a4459; transform: translateY(-2px); }
  .thumb {
    position: relative; display: block; width: 100%; aspect-ratio: 16 / 9;
    padding: 0; border: 0; cursor: pointer; background: #000;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
  .thumb:hover img { opacity: .85; }
  .thumb .play {
    position: absolute; inset: 0; margin: auto; width: 60px; height: 60px; border-radius: 50%;
    background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.85);
    display: grid; place-items: center; transition: background .2s, transform .2s;
  }
  .thumb:hover .play { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
  .thumb .play::before {
    content: ""; margin-left: 4px;
    border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
  }
  .thumb:hover .play::before { border-left-color: var(--accent-ink); }
  .thumb .dur {
    position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 6px;
    background: rgba(0,0,0,.75); color: #fff; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card .actions { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .card .related { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .card .related:hover { text-decoration: underline; }
  .download { font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .download::before { content: "↓ "; }
  .download:hover { color: var(--text); text-decoration: underline; }

  .audio {
    margin-top: 24px; padding: 18px 20px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .audio .label { font-weight: 600; }
  .audio .label small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  .audio audio { flex: 1; min-width: 240px; }

  footer { border-top: 1px solid var(--line); margin-top: 64px; padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--text); }

  /* Player */
  dialog.player {
    width: min(1100px, 94vw); padding: 0; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--text); overflow: hidden;
  }
  dialog.player::backdrop { background: rgba(5, 7, 10, .85); }
  dialog.player video { display: block; width: 100%; max-height: 75vh; background: #000; }
  .player-bar { display: flex; align-items: center; gap: 16px; padding: 14px 18px; }
  .player-bar h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
  .player-bar a:not(.download) { color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }
  .close {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .close:hover { border-color: var(--accent); }

  /* Celebration */
  #party { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .enter {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(30, 24, 8, .92), rgba(5, 7, 10, .96));
  }
  .enter[hidden] { display: none; }
  .enter button {
    font: 700 clamp(28px, 6vw, 48px)/1.1 Fraunces, Georgia, serif; color: var(--accent-ink);
    background: var(--accent); border: 0; border-radius: 999px; padding: 22px 44px; cursor: pointer;
    box-shadow: 0 0 0 0 rgba(232, 176, 75, .6); animation: pulse 1.6s infinite;
  }
  .enter p { margin: 18px 0 0; color: var(--muted); text-align: center; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(232, 176, 75, .55); }
    70% { box-shadow: 0 0 0 28px rgba(232, 176, 75, 0); }
    100% { box-shadow: 0 0 0 0 rgba(232, 176, 75, 0); }
  }
  .intro {
    position: fixed; inset: 0; z-index: 45; display: grid; place-items: center;
    background: #000; overflow: hidden; transition: opacity .7s ease;
  }
  .intro[hidden] { display: none; }
  .intro.out { opacity: 0; }
  .intro-bg {
    position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px);
    object-fit: cover; filter: blur(28px) brightness(.55) saturate(1.4);
  }
  .intro-fg {
    position: relative; height: min(90vh, 900px); aspect-ratio: 9 / 16; max-width: 92vw;
    object-fit: cover; border-radius: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    animation: introIn .6s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  @keyframes introIn { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .intro .skip {
    position: absolute; right: 16px; top: 16px; z-index: 1;
    background: rgba(0, 0, 0, .5); color: #fff; border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 999px; padding: 8px 16px; font: 600 14px Inter, sans-serif; cursor: pointer;
  }
  .intro .skip:hover { border-color: var(--accent); }
  @media (max-aspect-ratio: 3 / 4) {
    .intro-fg { height: 100%; width: 100%; max-width: none; border-radius: 0; }
  }
  .hero h1.pop { animation: pop .9s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Dancers strut along the bottom of the page while the song plays */
  #dancers {
    position: fixed; left: 0; bottom: 0; width: 100%; pointer-events: none; z-index: 15;
    opacity: 0; transition: opacity .6s ease;
  }
  #dancers.on { opacity: 1; }
  .music {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px; font: 600 14px Inter, sans-serif; cursor: pointer;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .4);
  }
  .music:hover { border-color: var(--accent); }
  .music .bars { display: inline-flex; gap: 2px; align-items: end; height: 14px; }
  .music .bars i { width: 3px; background: var(--accent); border-radius: 1px; height: 4px; }
  .music.on .bars i { animation: eq .9s ease-in-out infinite; }
  .music.on .bars i:nth-child(2) { animation-delay: -.3s; }
  .music.on .bars i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    header.top .wrap { gap: 12px; }
    .hero { padding: 48px 0 24px; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">Video <span>Showcase</span></a>
    <nav class="links" id="nav"></nav>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">Portfolio</div>
      <h1>Websites, promos &amp; commercials.</h1>
      <p>Guided website tours, Digital Doorway Marketing videos and commercials, all in one place. Click any video to watch.</p>
      <div class="stats" id="stats"></div>
    </section>

    <section id="build" aria-labelledby="build-h">
      <div class="cat-head">
        <div>
          <div class="eyebrow">Build your own</div>
          <h2 id="build-h">Website builders &amp; tools</h2>
        </div>
      </div>
      <div class="partners" id="partners"></div>
    </section>

    <div id="sections"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> Video Showcase</span>
    <nav id="footer-links"></nav>
  </div>
</footer>

<div class="intro" id="intro" hidden>
  <video class="intro-bg" id="intro-bg" src="assets/video/intro.mp4" poster="assets/video/intro-poster.jpg" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="intro-fg" id="intro-video" src="assets/video/intro.mp4" poster="assets/video/intro-poster.jpg" muted playsinline preload="auto"></video>
  <button class="skip" id="intro-skip" type="button">Skip intro</button>
</div>
<canvas id="party" aria-hidden="true"></canvas>
<div class="enter" id="enter" hidden>
  <div>
    <button type="button" id="enter-btn">Let's go! 🎉</button>
    <p>Tap to enter. Sound on 🔊</p>
  </div>
</div>
<canvas id="dancers" aria-hidden="true"></canvas>
<audio id="song" src="assets/audio/brother-reeves.mp3" preload="auto" loop></audio>
<button class="music" id="music" type="button" aria-pressed="false">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="music-label">Play “Brother Reeves”</span>
</button>

<dialog class="player" id="player" aria-labelledby="player-title">
  <video id="player-video" controls playsinline preload="metadata"></video>
  <div class="player-bar">
    <h3 id="player-title"></h3>
    <a id="player-link" target="_blank" rel="noopener" hidden></a>
    <a class="download" id="player-download" download>Download</a>
    <button class="close" id="player-close" type="button">Close</button>
  </div>
</dialog>

<script>
  // ---- Edit links here ----------------------------------------------------
  // Set each url to the live address. Leave it empty ("") to hide that link.
  const LINKS = {
    boomtownrat: {
      name: "BoomTownRat.com",
      tag: "Website building",
      desc: "Custom websites designed and built for your business.",
      url: "https://www.boomtownrat.com",
    },
    broker: {
      name: "Insurance Broker Template",
      tag: "Website builder",
      desc: "A ready-made website builder for insurance and Medicare brokers.",
      url: "https://earthwisegrounding.github.io/broker-site-builder/",
    },
    repdesk: {
      name: "RepDesk",
      tag: "Platform",
      desc: "Salesperson pages and lead management.",
      url: "",
    },
    colorado3d: {
      name: "Colorado 3D Design Landscape",
      tag: "3D landscape design",
      desc: "Design a Colorado landscape in 3D, as seen in the Prolawn 3D Design tour.",
      url: "https://earthwisegrounding.github.io/verdura/prolawn/designer.html",
    },
  };

  // ---- Videos ---------------------------------------------------------------
  // file: path relative to this page. dur: seconds. link: key from LINKS above.
  const CATEGORIES = [
    {
      id: "website-tours",
      eyebrow: "Walkthroughs",
      title: "Website Tours",
      desc: "Guided tours of finished client websites and platforms.",
      videos: [
        { title: "RepDesk Website Tour", file: "Website Tour/RepDesk Website Tour.mp4", poster: "repdesk-website-tour", dur: 453, link: "repdesk" },
        { title: "Medicare Video for Broker Template", file: "Website Tour/Medicare Video for Broker Template.mp4", poster: "medicare-video-for-broker-template", dur: 52, link: "broker" },
        { title: "Prolawn Website Tour: 3D Design", file: "Website Tour/Prolawn Website Tour 3D Design.mp4", poster: "prolawn-website-tour-3d-design", dur: 305, link: "colorado3d" },
        { title: "Prolawn Website Tour", file: "Website Tour/Prolawn Website Tour.mp4", poster: "prolawn-website-tour", dur: 172 },
        { title: "Hudson Auto Website Tour", file: "Website Tour/Hudson Auto Website Tour.mp4", poster: "hudson-auto-website-tour", dur: 293 },
        { title: "Adrian Manns Website Tour", file: "Website Tour/Adrian Manns Website Tour.mp4", poster: "adrian-manns-website-tour", dur: 209 },
        { title: "Alex Scott Website Tour", file: "Website Tour/Alex Scott Website Tour.mp4", poster: "alex-scott-website-tour", dur: 178 },
        { title: "Parish's Pistol Pointers Website Tour", file: "Website Tour/Parish's Pistol Pointers Website Tour.mp4", poster: "parishs-pistol-pointers-website-tour", dur: 437 },
      ],
    },
    {
      id: "digital-doorway",
      eyebrow: "Agency",
      title: "Digital Doorway Marketing",
      desc: "Explainers, promos and recruitment videos for Digital Doorway Marketing.",
      videos: [
        { title: "Explainer", file: "DDM/DigitalDoorwayMarketing Explainer.mp4", poster: "digitaldoorwaymarketing-explainer", dur: 105 },
        { title: "Commercial", file: "DDM/DigitalDoorwayMarketing Commerical.mp4", poster: "digitaldoorwaymarketing-commerical", dur: 28 },
        { title: "Promo 1", file: "DDM/DigitalDoorwayMarketing Promo1.mp4", poster: "digitaldoorwaymarketing-promo1", dur: 32 },
        { title: "Promo 2", file: "DDM/DigitalDoorwayMarketing Promo2.mp4", poster: "digitaldoorwaymarketing-promo2", dur: 35 },
        { title: "Recruitment", file: "DDM/DigitalDoorwayMarketing Recruitment.mp4", poster: "digitaldoorwaymarketing-recruitment", dur: 119 },
        { title: "You Incorporated", file: "DDM/DigitalDoorwayMarketing You Incorporated.mp4", poster: "digitaldoorwaymarketing-you-incorporated", dur: 180 },
      ],
      audio: { title: "You Incorporated", note: "Audio only", file: "DDM/You Incorporated.mp3" },
    },
    {
      id: "commercials",
      eyebrow: "Spots",
      title: "Commercials",
      desc: "Short-form commercials and brand spots.",
      videos: [
        { title: "Buy TFP: Spot 1", file: "Commericals/BuyTFP1.mp4", poster: "buytfp1", dur: 36 },
        { title: "Buy TFP: Spot 2", file: "Commericals/BuyTFP2.mp4", poster: "buytfp2", dur: 38 },
        { title: "Buy TFP: Spot 3", file: "Commericals/BuyTFP3.mp4", poster: "buytfp3", dur: 73 },
        { title: "Buy TFP: Spot 4", file: "Commericals/BuyTFP4.mp4", poster: "buytfp4", dur: 30 },
        { title: "Fyn Photo Co.", file: "Commericals/FynPhotoCo.mp4", poster: "fynphotoco", dur: 29 },
        { title: "Spoken Jazz", file: "Commericals/SpokenJazz.mp4", poster: "spokenjazz", dur: 102 },
      ],
    },
  ];

  // ---- Rendering -------------------------------------------------------------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  const linkOf = key => (key && LINKS[key] && LINKS[key].url) ? LINKS[key] : null;

  const all = CATEGORIES.flatMap(c => c.videos);
  const totalMin = Math.round(all.reduce((n, v) => n + v.dur, 0) / 60);
  document.getElementById("stats").innerHTML = `
    <div><strong>${all.length}</strong>videos</div>
    <div><strong>${CATEGORIES.length}</strong>collections</div>
    <div><strong>${totalMin} min</strong>of footage</div>`;

  document.getElementById("nav").innerHTML =
    CATEGORIES.map(c => `<a href="#${c.id}">${esc(c.title)}</a>`).join("") +
    `<a href="#build">Builders</a>`;

  const live = Object.values(LINKS).filter(l => l.url);
  document.getElementById("partners").innerHTML = live.map(l => `
    <a class="partner" href="${esc(l.url)}" target="_blank" rel="noopener">
      <span class="tag">${esc(l.tag)}</span>
      <span class="name">${esc(l.name)}</span>
      <span class="desc">${esc(l.desc)}</span>
      <span class="go">Visit ${esc(l.name)}</span>
    </a>`).join("");
  document.getElementById("build").hidden = live.length === 0;
  document.getElementById("footer-links").innerHTML =
    live.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`).join("");
  document.getElementById("year").textContent = new Date().getFullYear();

  document.getElementById("sections").innerHTML = CATEGORIES.map(c => `
    <section class="cat" id="${c.id}" aria-labelledby="${c.id}-h">
      <div class="cat-head">
        <div>
          <div class="eyebrow">${esc(c.eyebrow)}</div>
          <h2 id="${c.id}-h">${esc(c.title)}</h2>
          <p>${esc(c.desc)}</p>
        </div>
        <span class="count">${c.videos.length} videos</span>
      </div>
      <div class="grid">
        ${c.videos.map(v => {
          const l = linkOf(v.link);
          const i = all.indexOf(v);
          return `
          <article class="card">
            <button class="thumb" type="button" data-i="${i}" aria-label="Play ${esc(v.title)}">
              <img src="assets/posters/${v.poster}.jpg" alt="" loading="lazy" width="800" height="450">
              <span class="play" aria-hidden="true"></span>
              <span class="dur">${fmt(v.dur)}</span>
            </button>
            <div class="body">
              <h3>${esc(v.title)}</h3>
              <p>${esc(c.title)} · ${fmt(v.dur)}</p>
              <div class="actions">
                <a class="download" href="${esc(encodeURI(v.file))}" download aria-label="Download ${esc(v.title)}">Download</a>
                ${l ? `<a class="related" href="${esc(l.url)}" target="_blank" rel="noopener">Visit ${esc(l.name)} →</a>` : ""}
              </div>
            </div>
          </article>`;
        }).join("")}
      </div>
      ${c.audio ? `
      <div class="audio">
        <div class="label">${esc(c.audio.title)}<small>${esc(c.audio.note)}</small></div>
        <audio controls preload="none" src="${encodeURI(c.audio.file)}"></audio>
        <a class="download" href="${esc(encodeURI(c.audio.file))}" download aria-label="Download ${esc(c.audio.title)} audio">Download</a>
      </div>` : ""}
    </section>`).join("");

  // ---- Player ------------------------------------------------------------------
  const dlg = document.getElementById("player");
  const vid = document.getElementById("player-video");
  const pTitle = document.getElementById("player-title");
  const pLink = document.getElementById("player-link");
  const pDownload = document.getElementById("player-download");

  document.getElementById("sections").addEventListener("click", e => {
    const btn = e.target.closest(".thumb");
    if (!btn) return;
    const v = all[+btn.dataset.i];
    vid.src = pDownload.href = encodeURI(v.file);
    vid.poster = `assets/posters/${v.poster}.jpg`;
    pTitle.textContent = v.title;
    const l = linkOf(v.link);
    pLink.hidden = !l;
    if (l) { pLink.href = l.url; pLink.textContent = `Visit ${l.name} →`; }
    dlg.showModal();
    vid.play().catch(() => {});
  });
  const close = () => dlg.close();
  document.getElementById("player-close").addEventListener("click", close);
  dlg.addEventListener("click", e => { if (e.target === dlg) close(); });
  dlg.addEventListener("close", () => {
    vid.pause(); vid.removeAttribute("src"); vid.load();
    if (resumeSong) { resumeSong = false; playSong(); }
  });

  // ---- Song --------------------------------------------------------------------
  const song = document.getElementById("song");
  const musicBtn = document.getElementById("music");
  const musicLabel = document.getElementById("music-label");
  let resumeSong = false;
  song.volume = 0.8;
  const syncMusic = () => {
    const on = !song.paused;
    musicBtn.classList.toggle("on", on);
    musicBtn.setAttribute("aria-pressed", on);
    musicLabel.textContent = on ? "Pause music" : "Play “Brother Reeves”";
  };
  song.addEventListener("play", syncMusic);
  song.addEventListener("pause", syncMusic);
  const playSong = () => song.play();
  musicBtn.addEventListener("click", () => song.paused ? playSong().catch(() => {}) : song.pause());
  // Pause the song while a video plays, then pick it back up afterwards.
  vid.addEventListener("play", () => { if (!song.paused) { resumeSong = true; song.pause(); } });

  // ---- Fireworks & falling cash ------------------------------------------------
  const canvas = document.getElementById("party");
  const ctx = canvas.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1;
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  addEventListener("resize", resize);
  resize();

  const COLORS = ["#e8b04b", "#ff5a5f", "#4fd1c5", "#9f7aea", "#f6e05e", "#63b3ed", "#ffffff", "#48bb78"];
  const rand = (a, b) => a + Math.random() * (b - a);
  let sparks = [], rockets = [], bills = [], running = false, until = 0;

  function launch() {
    rockets.push({
      x: rand(W * 0.15, W * 0.85), y: H, vx: rand(-1, 1), vy: rand(-H / 70, -H / 55),
      color: COLORS[(Math.random() * COLORS.length) | 0],
    });
  }
  function burst(x, y, color) {
    const n = 70 + ((Math.random() * 40) | 0);
    const alt = COLORS[(Math.random() * COLORS.length) | 0];
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n, s = rand(1.5, 6.5);
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(0.008, 0.018), color: i % 3 ? color : alt });
    }
  }
  function dropBill() {
    bills.push({
      x: rand(-20, W + 20), y: rand(-120, -40), vy: rand(1.6, 3.6), sway: rand(0.6, 1.8),
      phase: rand(0, Math.PI * 2), rot: rand(-0.6, 0.6), spin: rand(-0.03, 0.03), size: rand(26, 44),
    });
  }
  function drawBill(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.scale(1, Math.cos(b.phase * 1.3) * 0.35 + 0.75); // a little flutter
    const w = b.size * 2.2, h = b.size;
    ctx.fillStyle = "#2f7d4a"; ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeStyle = "#a7e3b7"; ctx.lineWidth = 2; ctx.strokeRect(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6);
    ctx.fillStyle = "#cfeedd";
    ctx.beginPath(); ctx.ellipse(0, 0, h * 0.32, h * 0.36, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1f5c34";
    ctx.font = `700 ${h * 0.5}px Inter, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 1);
    ctx.font = `700 ${h * 0.24}px Inter, sans-serif`;
    ctx.fillStyle = "#cfeedd";
    ctx.fillText("100", -w / 2 + h * 0.35, -h / 2 + h * 0.25);
    ctx.fillText("100", w / 2 - h * 0.35, h / 2 - h * 0.25);
    ctx.restore();
  }

  function frame(now) {
    const active = now < until;
    if (active) {
      if (Math.random() < 0.06) launch();
      if (Math.random() < 0.25) dropBill();
    }
    ctx.clearRect(0, 0, W, H);

    rockets = rockets.filter(r => {
      r.x += r.vx; r.y += r.vy; r.vy += 0.12;
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2); ctx.fill();
      if (r.vy >= -1) { burst(r.x, r.y, r.color); return false; }
      return true;
    });

    ctx.globalCompositeOperation = "lighter";
    sparks = sparks.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.06; p.life -= p.decay;
      if (p.life <= 0) return false;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
      return true;
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    bills = bills.filter(b => {
      b.phase += 0.05; b.y += b.vy; b.x += Math.sin(b.phase) * b.sway; b.rot += b.spin;
      drawBill(b);
      return b.y < H + 80;
    });

    if (active || rockets.length || sparks.length || bills.length) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  function celebrate(ms = 9000) {
    document.querySelector(".hero h1").classList.remove("pop");
    void document.body.offsetWidth;
    document.querySelector(".hero h1").classList.add("pop");
    if (reduceMotion) return;
    until = performance.now() + ms;
    for (let i = 0; i < 4; i++) setTimeout(launch, i * 180);
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  // ---- Opening -----------------------------------------------------------------
  // Browsers usually block sound until the visitor interacts, so try autoplay
  // first and fall back to a one-tap "enter" screen that starts both together.
  const enter = document.getElementById("enter");
  const intro = document.getElementById("intro");
  const introVids = [document.getElementById("intro-video"), document.getElementById("intro-bg")];
  let introTimer = 0;

  function endIntro() {
    if (intro.hidden || intro.classList.contains("out")) return;
    clearTimeout(introTimer);
    intro.classList.add("out");
    setTimeout(() => { intro.hidden = true; introVids.forEach(v => v.pause()); }, 700);
  }
  function playIntro() {
    if (reduceMotion) return;
    intro.hidden = false;
    introVids.forEach(v => { v.currentTime = 0; v.play().catch(() => {}); });
    introTimer = setTimeout(endIntro, 6000); // fallback if the clip can't play
  }
  introVids[0].addEventListener("ended", endIntro);
  document.getElementById("intro-skip").addEventListener("click", endIntro);

  // The intro clip plays with the song while fireworks and cash fall over it,
  // then fades to reveal the page as the celebration carries on.
  function welcome() {
    playIntro();
    celebrate(11000);
  }
  playSong().then(welcome).catch(() => {
    enter.hidden = false;
    document.getElementById("enter-btn").focus();
  });
  document.getElementById("enter-btn").addEventListener("click", () => {
    enter.hidden = true;
    playSong().catch(() => {});
    welcome();
  });
  document.querySelector(".brand").addEventListener("click", () => celebrate(5000));
</script>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  // ---- Dancers -----------------------------------------------------------------
  // Marv (from Clash of the Titans) and the Proud Air Force Dad strut along the
  // bottom of the page while the song plays: each walks (or runs) to a new spot,
  // dances, and now and then shows off a move. Three.js and the models load on
  // first play.
  const song = document.getElementById("song");
  const canvas = document.getElementById("dancers");
  const CAST = [
    {
      file: "assets/marv.glb", x: 0.2, z: 0,
      dances: ["dance1", "dance2", "dance3"],
      moves: [["punch", 1.4], ["kick", 1.2], ["jump", 1]],
    },
    {
      file: "assets/airforce-dad.glb", x: 0.75, z: -400,
      dances: ["dance1", "dance2"], // Boom Dance, YMCA
      moves: [["squat", 1]],
    },
  ];
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    let stage = null, loading = null, raf = 0, hideTimer = 0;

    async function load() {
      const THREE = await import("three");
      const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
      const loader = new GLTFLoader();
      const models = await Promise.all(CAST.map(c => loader.loadAsync(c.file)));

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(0, 1, 1, 0, -2000, 2000);
      camera.position.z = 1000;
      scene.add(new THREE.HemisphereLight(0xfff4e0, 0x30384a, 2.2));
      const sun = new THREE.DirectionalLight(0xffffff, 2.4);
      sun.position.set(300, 600, 800);
      scene.add(sun);

      let W = 0, size = 0;
      const margin = () => size * 0.4;
      const dancers = CAST.map((c, i) => makeDancer(THREE, scene, models[i], c));

      function makeDancer(THREE, scene, gltf, cfg) {
        // Normalise the model to 1 unit tall, feet on the ground, centred.
        const visual = gltf.scene;
        const box = new THREE.Box3().setFromObject(visual);
        const unit = 1 / (box.max.y - box.min.y);
        visual.scale.setScalar(unit);
        visual.position.set(-(box.min.x + box.max.x) / 2 * unit, -box.min.y * unit, -(box.min.z + box.max.z) / 2 * unit);
        visual.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
        const body = new THREE.Group();
        body.add(visual);
        const shadow = new THREE.Mesh(
          new THREE.CircleGeometry(0.5, 32),
          new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false })
        );
        shadow.renderOrder = -1;
        scene.add(shadow, body);

        // Keep clips in place (same fix as the game) so we steer them ourselves.
        const mixer = new THREE.AnimationMixer(visual);
        const spine = visual.getObjectByName("spine");
        const actions = {};
        for (const src of gltf.animations) {
          const clip = src.clone();
          const track = clip.tracks.find(t => t.name === "spine.position");
          if (track && spine) for (let i = 0; i < track.values.length; i += 3) {
            track.values[i] = spine.position.x;
            track.values[i + 2] = spine.position.z;
          }
          actions[clip.name] = mixer.clipAction(clip);
        }
        let current = null;
        const play = (name, { once = false, speed = 1 } = {}) => {
          const next = actions[name];
          if (!next || current === next) return next;
          next.reset().setEffectiveTimeScale(speed).setEffectiveWeight(1);
          next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
          next.clampWhenFinished = once;
          next.play();
          if (current) next.crossFadeFrom(current, 0.25, true);
          current = next;
          return next;
        };

        // Choreography: walk somewhere, dance, maybe show off a move, repeat.
        const d = {
          x: innerWidth * cfg.x, targetX: 0, mode: "", timer: 0, speed: 0, facing: 0, danceIx: 0,
          resize() {
            body.scale.setScalar(size);
            shadow.scale.set(size * 0.55, size * 0.08, 1);
            d.x = Math.min(Math.max(d.x, margin()), W - margin());
          },
          next() {
            if (d.mode !== "dance" && d.mode !== "move") {
              d.mode = "dance";
              const a = play(cfg.dances[d.danceIx++ % cfg.dances.length]);
              const len = a.getClip().duration;
              d.timer = len < 5 ? len * 2 : len;
            } else if (d.mode === "dance" && Math.random() < 0.4) {
              d.mode = "move";
              const [name, sp] = cfg.moves[(Math.random() * cfg.moves.length) | 0];
              const a = play(name, { once: true, speed: sp });
              d.timer = a.getClip().duration / sp;
            } else {
              d.mode = "walk";
              d.targetX = pickSpot(d);
              const run = Math.abs(d.targetX - d.x) > W * 0.45 && Math.random() < 0.6;
              play(run ? "run" : "walk");
              d.speed = size * (run ? 3.2 : 1.5);
            }
          },
          update(dt) {
            if (d.mode === "walk") {
              const step = Math.sign(d.targetX - d.x) * d.speed * dt;
              d.facing = step > 0 ? Math.PI / 2 : -Math.PI / 2;
              if (Math.abs(d.targetX - d.x) <= Math.abs(step)) { d.x = d.targetX; d.mode = "arrive"; d.next(); }
              else d.x += step;
            } else {
              d.facing = 0.35 * Math.sign(W / 2 - d.x || 1); // three-quarter turn toward the page
              if ((d.timer -= dt) <= 0) d.next();
            }
            body.rotation.y += (d.facing - body.rotation.y) * (1 - Math.exp(-dt * 10));
            body.position.set(d.x, size * 0.06, cfg.z);
            shadow.position.set(d.x, size * 0.06, cfg.z - 500);
            mixer.update(dt);
          },
        };
        return d;
      }

      // A new spot a fair distance away that doesn't land on top of anyone else.
      function pickSpot(me) {
        const lo = margin(), hi = W - margin();
        let best = me.x, bestScore = -Infinity;
        for (let i = 0; i < 12; i++) {
          const t = lo + Math.random() * (hi - lo);
          const gap = Math.min(...dancers.filter(o => o !== me).map(o => Math.min(Math.abs(t - o.x), Math.abs(t - o.targetX))));
          const score = Math.min(Math.abs(t - me.x), (hi - lo) * 0.25) + Math.min(gap, size);
          if (score > bestScore) { best = t; bestScore = score; }
        }
        return best;
      }

      const resize = () => {
        W = innerWidth;
        size = Math.round(Math.min(240, Math.max(130, innerHeight * 0.26)));
        const h = Math.round(size * 1.5);
        canvas.style.height = h + "px";
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        renderer.setSize(W, h, false);
        camera.right = W; camera.top = h; camera.updateProjectionMatrix();
        dancers.forEach(d => d.resize());
      };
      addEventListener("resize", () => stage && resize());

      const clock = new THREE.Clock();
      function frame() {
        raf = requestAnimationFrame(frame);
        const dt = Math.min(clock.getDelta(), 0.1);
        dancers.forEach(d => d.update(dt));
        renderer.render(scene, camera);
      }

      stage = {
        start() { clock.getDelta(); if (!raf) frame(); },
        stop() { cancelAnimationFrame(raf); raf = 0; },
      };
      resize();
      dancers.forEach(d => d.next());
    }

    function show() {
      clearTimeout(hideTimer);
      loading ||= load().catch(err => console.warn("Dancers could not load", err));
      loading.then(() => {
        if (!stage || song.paused) return;
        stage.start();
        canvas.classList.add("on");
      });
    }
    function hide() {
      canvas.classList.remove("on");
      hideTimer = setTimeout(() => stage && stage.stop(), 700);
    }
    song.addEventListener("play", show);
    song.addEventListener("pause", hide);
    if (!song.paused) show();
  }
</script>
</body>
</html>
